# Гейт на каждый PR. С 2026-09-11 защита ветки `main` включена и обе работы
# ниже — обязательные проверки.
#
# Имена работ — `python` и `kotlin` — это и есть контексты обязательных
# проверок в настройках защиты. Русское название через `name:` их переименовало
# бы, и защита ждала бы контекста, которого никто не присылает: PR навсегда
# застревает в BLOCKED. Поэтому здесь id работы и её имя совпадают.
name: гейт

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:                             # unittest и self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'      # как на doctor
      - name: гейт без андроида
        env:
          SKIP_ANDROID: '1'           # Kotlin отдельной работой, ниже
          # дефолты смотрят в /srv, которого на раннере нет: указываем на
          # временный каталог, чтобы промахнувшийся тест не создавал каталоги
          # в системе раннера
          MARA_BLOBS: ${{ runner.temp }}/mara-blobs
          VAULT: ${{ runner.temp }}/vault
          MARA_VAULT: ${{ runner.temp }}/vault
        run: bash scripts/run-tests.sh

  kotlin:                             # Kotlin-ядро приложения
    runs-on: ubuntu-latest            # aapt2 и d8 есть только под x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew test --console=plain
        working-directory: android
